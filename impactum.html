<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Impactum — GPS d'urgence</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #f4f6fb;
  color: #1a202c;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ── SCREEN 0 ── */
#s0 {
  background: #ffffff;
  justify-content: center;
  align-items: center;
  padding: 2.5rem 2rem;
  text-align: center;
}
.splash-logo-img {
  width: 320px;
  max-width: 90%;
  margin-bottom: 1.2rem;
}
.splash-tagline {
  color: #5a6a8a;
  font-size: 0.9rem;
  letter-spacing: 0.04em;
  margin-top: 0.35rem;
  margin-bottom: 2.8rem;
}
.btn-main {
  background: #f5921e;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 1rem 2.5rem;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 0.02em;
  box-shadow: 0 4px 18px rgba(245,146,30,0.45);
  transition: transform 0.1s;
}
.btn-main:active { transform: scale(0.97); }

/* ── HEADER ── */
.app-header {
  background: #ffffff;
  padding: 0.85rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.header-brand-logo {
  height: 85px;
  cursor: pointer;
}
.header-back {
  background: #fff8f0;
  color: #c97010;
  border: none;
  border-radius: 20px;
  padding: 0.45rem 1rem;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.header-back:active { transform: scale(0.95); }

/* ── SCREEN 1 : Situations ── */
.screen-question {
  padding: 1.1rem 1.25rem 0.6rem;
  font-size: 1.05rem;
  font-weight: 700;
  color: #f5921e;
}
.situations-list { padding: 0 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
.situation-card {
  background: white;
  border-radius: 14px;
  padding: 1rem 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  transition: transform 0.1s, box-shadow 0.1s;
}
.situation-card:active { transform: scale(0.98); box-shadow: none; }
.sit-icon-wrap { width: 54px; text-align: center; font-size: 1.55rem; flex-shrink: 0; }
.sit-content { flex: 1; }
.sit-title { font-size: 0.95rem; font-weight: 700; color: #1a202c; margin-bottom: 0.12rem; line-height: 1.3; }
.sit-sub   { font-size: 0.76rem; color: #718096; font-style: italic; }
.sit-arrow { color: #cbd5e0; font-size: 1.3rem; padding-right: 0.5rem; flex-shrink: 0; }

/* ── SCREEN 2 : Intentions ── */
.sit-context {
  margin: 0.75rem 1rem 0;
  background: #ffffff;
  color: #1a202c;
  padding: 0.5rem 1rem;
  border-radius: 12px;
  flex-shrink: 0;
}
.sit-context-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: #5a6a8a; margin-bottom: 0.2rem; }
.sit-context-title { font-size: 0.93rem; font-weight: 700; }
.intentions-list {
  padding: 0.75rem 1rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}
.intention-card {
  background: white;
  border-radius: 12px;
  padding: 0.9rem 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  transition: transform 0.1s, box-shadow 0.1s;
}
.intention-card:active { transform: scale(0.98); box-shadow: none; }
.int-icon-wrap { font-size: 1.5rem; flex-shrink: 0; width: 36px; text-align: center; }
.int-title { flex: 1; font-weight: 600; font-size: 0.91rem; color: #1a202c; line-height: 1.35; }

/* ── SCREEN 3 : Fiche ── */
.fiche-sit-bar {
  padding: 0.3rem 1.25rem;
  font-size: 0.78rem;
  color: #5a6a8a;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.fiche-scroll-wrap { flex: 1; overflow: hidden; position: relative; }
.fiche-scroll-wrap::after { content:''; position:absolute; bottom:0; left:0; right:0; height:40px; background:linear-gradient(transparent,#f4f6fb); pointer-events:none; }
.fiche-scroll { height: 100%; overflow-y: auto; padding: 0.75rem 1rem 1rem; }
.int-header {
  background: #fff8f0;
  border-left: 4px solid #f5921e;
  padding: 0.8rem 1rem;
  border-radius: 10px;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}
.int-header-icon { font-size: 1.6rem; flex-shrink: 0; }
.int-header-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: #f5921e; margin-bottom: 0.15rem; }
.int-header-title { font-size: 0.93rem; font-weight: 700; color: #1a202c; }
.fiche-section {
  background: #eef3ff;
  border-radius: 12px;
  padding: 0.85rem 1rem;
  margin-bottom: 0.75rem;
  border-left: 4px solid #1e45b0;
}
.section-label { font-size: 0.63rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.7rem; }
.label-concret { color: #1e45b0; }
.label-formul  { color: #d35400; }
.label-savoir  { color: #27ae60; }
.fiche-section p { font-size: 0.93rem; color: #2d3748; line-height: 1.65; margin-bottom: 0.4rem; }
.fiche-section p:last-child { margin-bottom: 0; }
.fiche-section.formul { background: #fff3e0; border-left: 4px solid #e67e22; }
.fiche-section.savoir { background: #e8faf0; border-left: 4px solid #27ae60; }
.savoir-item { display: flex; gap: 0.5rem; align-items: flex-start; margin-bottom: 0.45rem; font-size: 0.93rem; color: #2d3748; line-height: 1.55; }
.savoir-item:last-child { margin-bottom: 0; }
.savoir-check { color: #27ae60; flex-shrink: 0; margin-top: 0.05rem; }

/* ── NAV BAS ── */
.bottom-nav {
  display: flex;
  gap: 0.6rem;
  padding: 0.75rem 1rem;
  background: #f4f6fb;
  flex-shrink: 0;
}
.bnav-btn { flex: 1; padding: 0.75rem 0.5rem; min-height: 44px; border-radius: 10px; border: none; cursor: pointer; font-size: 0.82rem; font-weight: 700; transition: transform 0.1s; }
.bnav-btn:active { transform: scale(0.96); }
.bnav-intentions { background: #eff6ff; color: #1e45b0; }
.bnav-situation  { background: #fff8f0; color: #c97010; }
</style>
</head>

<script>
let currentSit = 0, currentInt = 0;

const DATA = [
  {
    num:"1", icon:"🔄",
    title:"Ça tourne en rond",
    subtitle:"répétitions, blocage, rien n'avance",
    intentions:[
      { icon:"💡", title:"Créer un déclic",
        concret:["Amenez la métaphore du match de foot avec humour, comme une image qui vous vient, sans analyse.","Laissez-la produire son effet.","Relancez ensuite vers l'action."],
        formul:["« Vous savez à quoi ça me fait penser ?","À un match de foot où les équipes se font des passes, mais où personne ne tente de marquer.","Alors, qu'est-ce qu'on pourrait proposer pour que ça avance concrètement, là, tout de suite ? »"],
        savoir:["La métaphore suffit : inutile de l'expliquer.","Le ton peut être léger, presque complice.","Une pause après la métaphore renforce l'effet."]
      },
      { icon:"🔒", title:"Verrouiller ce qui a été dit, pour éviter le retour en arrière",
        concret:["Reformulez brièvement ce qui revient en boucle.","L'écrire au tableau ou sur une feuille — posez-le clairement comme acquis.","Vérifiez l'accord des parties, puis fermez ce point pour pouvoir avancer."],
        formul:["« Voilà ce qui a été dit.","Est-ce que tout le monde est d'accord sur ça ? OK, alors on n'y reviendra plus ?","Bon, à partir de là, comment on avance ? »"],
        savoir:["Le fait de verrouiller libère de l'énergie pour la suite.","Dire explicitement qu'on n'y reviendra plus évite les retours en arrière.","Cette étape n'est pas autoritaire : elle sécurise le cadre."]
      },
      { icon:"🔍", title:"Chercher ce que chacun veut préserver",
        concret:["Invitez chaque partie à nommer ce qui est important pour elle derrière sa position.","Faites-le de manière ouverte, sans chercher à résoudre."],
        formul:["« Dans cette position, qu'est-ce que vous cherchez à préserver ? »","","« Qu'est-ce que vous craignez de perdre si vous lâchez sur ce point ? »"],
        savoir:["Ce que chacun cherche à préserver ouvre des pistes de solution.","Il ne s'agit pas de négocier, mais de rendre visibles les enjeux.","Les parties ont seulement besoin d'entendre ce qui est important pour chacune d'elles."]
      }
    ]
  },
  {
    num:"2", icon:"⚡",
    title:"La tension est en train de monter",
    subtitle:"agacement, crispation, échauffement",
    intentions:[
      { icon:"🎯", title:"Nommer pour désamorcer",
        concret:["Utiliser un élastique et le tendre très fort — ou la métaphore de l'élastique si vous n'en avez pas."],
        formul:["« Je sens que la tension monte en ce moment.","Avant de continuer, je voudrais qu'on prenne un moment pour la nommer.","Est-ce que vous ressentez aussi cette tension ? »","","Tendre l'élastique et dire : regardez cet élastique. Si je continue à le tendre, qu'est-ce qui va se passer ?","Laisser répondre, puis : c'est exactement ce qui se passe ici. Qu'est-ce qu'on fait pour ne pas qu'il casse ?"],
        savoir:["Nommer la tension ne l'aggrave pas, cela la rend visible.","La métaphore de l'élastique déplace l'attention du conflit vers la dynamique.","Le médiateur ne vise personne : il parle de ce qui se passe, pas de qui a tort."]
      },
      { icon:"🪞", title:"Faire réfléchir aux conséquences",
        concret:["Faire réfléchir les personnes à la trajectoire actuelle, puis à une trajectoire apaisée."],
        formul:["« Si on continue comme ça, où est-ce que ça peut nous mener ?","Et si on arrive à apaiser la situation, où est-ce que ça pourrait nous mener ? »","","Puis : noter les réponses au tableau ou sur une feuille pour les rendre visibles."],
        savoir:["Interroger la trajectoire aide à sortir du moment présent pour prendre de la hauteur.","Ce sont les parties qui imaginent les conséquences, pas le médiateur.","Écrire les réponses rend la prise de conscience concrète et visible.","Comparer deux trajectoires ouvre naturellement un choix."]
      },
      { icon:"🌊", title:"Faire baisser l'intensité",
        concret:["Modifier volontairement votre rythme et votre posture pour induire l'apaisement.","Parler plus lentement, articuler davantage, ralentir les gestes, adopter une posture stable.","Ne pas élever la voix pour couvrir la tension."],
        formul:["« Je vous propose qu'on ralentisse un peu. »"],
        savoir:["Le rythme du médiateur influence le rythme des parties.","Baisser l'intensité passe d'abord par le corps, avant les mots.","L'apaisement se transmet plus qu'il ne se décrète."]
      }
    ]
  },
  {
    num:"3", icon:"🛡️",
    title:"L'impact est nié",
    subtitle:"« Ce n'est pas ce que je voulais dire »",
    intentions:[
      { icon:"⚖️", title:"Faire comprendre que l'intention n'efface pas l'impact",
        concret:["Rendre l'impact perceptible sans attaquer l'intention."],
        formul:["« On ne remet pas en cause votre intention.","Mais l'impact, lui, a été vécu comme blessant.","Qu'est-ce que ça vous fait d'entendre que ça a été vécu comme ça ? »"],
        savoir:["Intention et impact ne se situent pas au même endroit.","Entendre l'impact est une étape clé avant toute réparation.","Il ne s'agit pas de juger, mais de faire place à l'expérience vécue."]
      },
      { icon:"👁️", title:"Rendre l'impact visible",
        concret:["Racontez l'histoire de la planche à clous.","Ne moralisez pas.","Laissez l'histoire agir."],
        formul:["Il était une fois un petit garçon qui blessait souvent les autres avec ses paroles.","Un jour, son père lui donne une planche en bois et une poignée de clous.","Il lui dit : « À chaque parole blessante, tu planteras un clou dans cette planche. »","","Très vite, la planche se remplit de clous.","Peu à peu, le garçon apprend à se maîtriser.","Un jour, tout fier, il revient voir son père. Aujourd'hui, je n'ai planté aucun clou.","Son père lui tend alors une pince. Maintenant enlève-les tous.","","Quand les clous sont retirés, le père demande : comment est la planche maintenant ? Le petit garçon répond : pleine de trous.","Le père dit alors : tu vois, même quand on enlève les clous, les traces restent. Et les paroles blessantes, c'est pareil. Ça laisse des marques."],
        savoir:["Si le récit risque de mettre en difficulté, privilégier l'aparté.","Inutile d'expliquer : l'histoire suffit."]
      },
      { icon:"🔧", title:"Inviter à chercher comment réparer",
        concret:["Inviter à penser la réparation sans imposer."],
        formul:["Il était une fois un petit garçon qui blessait souvent les autres avec ses paroles.","Un jour, son père lui donne une planche en bois et une poignée de clous.","Il lui dit : « À chaque parole blessante, tu planteras un clou dans cette planche. »","","Très vite, la planche se remplit de clous.","Peu à peu, le garçon apprend à se maîtriser.","Un jour, tout fier, il revient voir son père. Aujourd'hui, je n'ai planté aucun clou.","Son père lui tend alors une pince. Maintenant enlève-les tous.","","Quand les clous sont retirés, le père demande : comment est la planche maintenant ? Le petit garçon répond : pleine de trous.","Le père dit alors : tu vois, même quand on enlève les clous, les traces restent. Et les paroles blessantes, c'est pareil. Ça laisse des marques.","","Puis demander :","","« Et maintenant, comment on pourrait faire pour réparer cette planche ? Pour la lisser.","Utiliser de la pâte à bois ? La raboter ?","Quelles seraient les propositions que vous pourriez faire, là, maintenant ? »"],
        savoir:["La réparation ne peut pas être imposée, elle doit venir des parties.","Chercher comment réparer déplace la discussion de la faute vers la responsabilité.","La question ouvre un espace d'action plutôt qu'un débat sur le passé."]
      }
    ]
  },
  {
    num:"4", icon:"🚧",
    title:"Chaque proposition est refusée",
    subtitle:"« Oui mais non », tout est rejeté",
    intentions:[
      { icon:"❓", title:"Interroger la peur derrière le rejet",
        concret:["Accueillez le refus sans le contester.","Déplacez l'attention vers ce qui inquiète derrière le rejet.","Posez une question simple, sans interpréter ni accuser."],
        formul:["« Qu'est-ce qui vous inquiète dans cette proposition ? »","","Ou","","« Qu'est-ce que vous craignez si on allait dans cette direction ? »"],
        savoir:["Le rejet est souvent une protection.","Mettre des mots sur la peur désamorce le sabotage.","Il ne s'agit pas de convaincre, mais de comprendre."]
      },
      { icon:"🔀", title:"Transformer le rejet",
        concret:["Ne pas contester le « non ».","Le prendre comme un point de départ.","Explorer ce qui rendrait la proposition acceptable, même partiellement.","À ce stade, chercher un ajustement concret plutôt qu'un accord total."],
        formul:["« Qu'est-ce qu'il faudrait ajuster pour que cette proposition soit envisageable pour vous ? »"],
        savoir:["La personne peut enfin dire ce qui bloque vraiment.","Parfois, un détail suffit pour débloquer la situation.","Si la réponse reste « rien », inutile d'insister : changer de piste.","Réfléchir sur ce qui se passera si rien n'avance ou passer à l'intention :<br><button data-goto-intention=\"2\" style=\"margin-top:6px;background:none;border:none;color:#1e45b0;text-decoration:underline;cursor:pointer;font-weight:600;font-size:inherit;padding:0;\">→ Inciter à formuler une alternative</button>"]
      },
      { icon:"💬", title:"Inciter à formuler une alternative",
        concret:["Arrêtez la spirale du rejet en utilisant une citation.","Demandez explicitement autre chose.","Redonnez la responsabilité de proposer des alternatives.","Restez factuel, sans ironie ni pression."],
        formul:["« Ça me fait penser à une citation de Jacques Prévert, qui dit :","","« Il suivait son idée, c'était une idée fixe,","et il s'étonnait de ne pas avancer. »","","Laisser un court silence puis dire par exemple : alors ici et maintenant, qu'est-ce qu'on pourrait proposer autrement ? »"],
        savoir:["La citation sert à créer un léger déclic, pas à faire la morale.","L'objectif est simple : obtenir une proposition différente, même imparfaite.","Une seule alternative suffit pour relancer le mouvement."]
      }
    ]
  },
  {
    num:"5", icon:"🚶",
    title:"Quelqu'un se met en retrait",
    subtitle:"silence, retrait, mise sur le banc de touche",
    intentions:[
      { icon:"🛡️", title:"Redonner un sentiment de sécurité",
        concret:["Créez un espace sans jugement.","Par votre posture, votre rythme et votre présence, montrez que la personne est en sécurité.","Ralentir volontairement le débit de parole et les gestes.","Orienter légèrement le corps vers la personne.","Accepter le silence.","Vous prenez la responsabilité du cadre pour alléger la pression sur la personne.","Vous interrogez doucement, sans insister, sans interpréter."],
        formul:["« J'ai l'impression que vous vous êtes un peu mis en retrait depuis tout à l'heure.","Est-ce que vous pouvez me dire comment vous vivez ce qui se passe ? »","","(Proposer un aparté si besoin)"],
        savoir:["Le mimétisme apaise souvent plus que les mots.","Inutile de remplir le silence.","L'objectif n'est pas de faire parler, mais de sécuriser."]
      },
      { icon:"🗣️", title:"Inviter à mettre des mots",
        concret:["Après avoir laissé un temps de retrait et de sécurité, adressez-vous à la personne avec douceur.","Parlez en « je », sans interpréter ni presser.","Invitez-la à dire ce qu'elle peut dire, même peu."],
        formul:["(En plénière ou en aparté, selon ce qui est le plus juste)","","« De mon côté, j'ai l'impression que quelque chose vous a freiné.","Qu'est-ce que vous auriez envie de nous dire là-dessus ? »"],
        savoir:["Inviter n'est pas forcer.","Quelques mots suffisent.","Si parler devant l'autre est trop difficile, proposer un aparté."]
      },
      { icon:"🤝", title:"Réengager sa participation",
        concret:["Invitez la personne à faire un pas minuscule, possible ici et maintenant.","Présentez la règle des quatre P pour capter l'attention.","Laissez la personne choisir ce qu'elle est prête à faire, même très peu."],
        formul:["« Est-ce que vous connaissez la règle des 4 P ?","(En général, la réponse est non)","","Les 4 P, c'est le Plus Petit Pas Possible.","Alors, quel est le plus petit pas possible que vous pourriez envisager de faire, là, tout de suite ? »"],
        savoir:["Le pas peut être minime.","L'objectif est de revenir dans le jeu, pas de résoudre.","Ne pas insister si la personne n'est pas prête."]
      }
    ]
  }
];

function goTo(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s'+n).classList.add('active');
  window.scrollTo(0,0);
}
function selectSituation(i) { currentSit=i; renderIntentions(); goTo(2); }
function selectIntention(i)  { currentInt=i; renderFiche();      goTo(3); }

function renderSituations() {
  document.getElementById('situations-list').innerHTML = DATA.map((s,i) => `
    <div class="situation-card" onclick="selectSituation(${i})">
      <div class="sit-icon-wrap">${s.icon}</div>
      <div class="sit-content">
        <div class="sit-title">${s.num}. ${s.title}</div>
        <div class="sit-sub">${s.subtitle}</div>
      </div>
      <div class="sit-arrow">›</div>
    </div>`).join('');
}

function renderIntentions() {
  const sit = DATA[currentSit];
  document.getElementById('sit-context-title').innerHTML = `<span style='font-size:1.4rem'>${sit.icon}</span> <strong>${sit.title}</strong><br><span style='font-weight:400;color:#64748b;font-size:0.82rem'>${sit.subtitle}</span>`;
  document.getElementById('intentions-list').innerHTML = sit.intentions.map((it,i) => `
    <div class="intention-card" onclick="selectIntention(${i})">
      <div class="int-icon-wrap">${it.icon}</div>
      <div class="int-title">${it.title}</div>
      <div class="sit-arrow">›</div>
    </div>`).join('');
}

function renderFiche() {
  const sit = DATA[currentSit];
  const it = sit.intentions[currentInt];
  const c = it.concret.map(p => p?`<p>${p}</p>`:'').join('');
  const f = it.formul.map(p => p===''?'<p>&nbsp;</p>':`<p>${p}</p>`).join('');
  const s = it.savoir.map(p =>`<div class="savoir-item"><span class="savoir-check">✓</span><span>${p}</span></div>`).join('');
  document.getElementById('s3-sit-label').innerHTML = `<span>${sit.icon}</span><strong style="color:#1a202c;">${sit.title}</strong>`;
  document.getElementById('fiche-scroll').innerHTML = `
    <div class="int-header">
      <div class="int-header-icon">${it.icon}</div>
      <div>
        <div class="int-header-label">Intention</div>
        <div class="int-header-title">${it.title}</div>
      </div>
    </div>
    <div class="fiche-section"><div class="section-label label-concret">🛠️ Comment faire concrètement</div>${c}</div>
    <div class="fiche-section formul"><div class="section-label label-formul">💬 Formulation possible</div>${f}</div>
    <div class="fiche-section savoir"><div class="section-label label-savoir">📌 À savoir</div>${s}</div>`;
}

renderSituations();

document.getElementById('fiche-scroll').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-goto-intention]');
  if (btn) selectIntention(parseInt(btn.getAttribute('data-goto-intention')));
});
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Impactis — GPS d'urgence</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #f4f6fb;
  color: #1a202c;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ── SCREEN 0 ── */
#s0 {
  background: #ffffff;
  justify-content: center;
  align-items: center;
  padding: 2.5rem 2rem;
  text-align: center;
}
.splash-logo-img {
  width: 320px;
  max-width: 90%;
  margin-bottom: 1.2rem;
}
.splash-name {
  font-size: 2.3rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  margin-top: 0.5rem;
  line-height: 1;
}
.splash-impact { color: #ffffff; }
.splash-um     { color: #f5921e; }
.splash-tagline {
  color: #5a6a8a;
  font-size: 0.9rem;
  letter-spacing: 0.04em;
  margin-top: 0.35rem;
  margin-bottom: 2.8rem;
}
.btn-main {
  background: #f5921e;
  color: white;
  border: none;
  padding: 1.2rem 2rem;
  font-size: 1.15rem;
  font-weight: 700;
  border-radius: 14px;
  cursor: pointer;
  width: 100%;
  max-width: 300px;
  letter-spacing: 0.02em;
  box-shadow: 0 4px 18px rgba(245,146,30,0.45);
  transition: transform 0.1s;
}
.btn-main:active { transform: scale(0.97); }
.btn-secondary {
  background: transparent;
  color: #f5921e;
  border: 2px solid #f5921e;
  border-radius: 14px;
  padding: 0.8rem 2.5rem;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.02em;
  margin-top: 0.9rem;
  transition: transform 0.1s;
}
.btn-secondary:active { transform: scale(0.97); }

/* ── HEADER ── */
.app-header {
  background: #ffffff;
  padding: 0.85rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.header-brand-logo {
  height: 110px;
  cursor: pointer;
}
.header-logo-text {
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: 0.1em;
}
.hl-impact { color: #ffffff; }
.hl-um     { color: #f5921e; }
.header-back {
  background: #f5921e;
  border: none;
  color: white;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  padding: 0.45rem 0.85rem;
  border-radius: 20px;
  transition: transform 0.1s;
  white-space: nowrap;
}
.header-back:active { transform: scale(0.95); }

/* ── SCREEN 1 : Situations ── */
.screen-question {
  padding: 1.1rem 1.25rem 0.6rem;
  font-size: 1rem;
  font-weight: 600;
  color: #4a5568;
}
.situations-list {
  padding: 0.5rem 1rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  flex: 1;
}
.situation-card {
  background: white;
  border-radius: 14px;
  padding: 1rem 1rem 1rem 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  box-shadow: 0 1px 5px rgba(0,0,0,0.08);
  border-left: 5px solid #1e45b0;
  transition: transform 0.1s, box-shadow 0.1s;
  overflow: hidden;
}
.situation-card:active { transform: scale(0.98); box-shadow: none; }
.sit-icon-wrap { width: 54px; text-align: center; font-size: 1.55rem; flex-shrink: 0; }
.sit-content { flex: 1; }
.sit-title { font-size: 0.95rem; font-weight: 700; color: #1a202c; margin-bottom: 0.12rem; line-height: 1.3; }
.sit-sub   { font-size: 0.76rem; color: #718096; font-style: italic; }
.sit-arrow { color: #cbd5e0; font-size: 1.3rem; padding-right: 0.5rem; flex-shrink: 0; }

/* ── SCREEN 2 : Intentions ── */
.sit-context {
  margin: 0.75rem 1rem 0;
  background: #ffffff;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 12px;
  flex-shrink: 0;
}
.sit-context-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: #5a6a8a; margin-bottom: 0.2rem; }
.sit-context-title { font-size: 0.93rem; font-weight: 700; }
.intentions-list {
  padding: 0.75rem 1rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  flex: 1;
}
.intention-card {
  background: white;
  border-radius: 14px;
  padding: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.85rem;
  box-shadow: 0 1px 5px rgba(0,0,0,0.08);
  transition: transform 0.1s, box-shadow 0.1s;
}
.intention-card:active { transform: scale(0.98); box-shadow: none; }
.int-icon-wrap { font-size: 1.5rem; flex-shrink: 0; width: 36px; text-align: center; }
.int-title { flex: 1; font-weight: 600; font-size: 0.91rem; color: #1a202c; line-height: 1.35; }

/* ── SCREEN 3 : Fiche ── */
.fiche-scroll { flex: 1; overflow-y: auto; padding: 0.75rem 1rem 1rem; }
.int-header {
  background: #fff8f0;
  border-left: 4px solid #f5921e;
  padding: 0.8rem 1rem;
  border-radius: 10px;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.int-header-icon { font-size: 1.6rem; flex-shrink: 0; }
.int-header-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: #f5921e; margin-bottom: 0.15rem; }
.int-header-title { font-size: 0.93rem; font-weight: 700; color: #1a202c; }
.fiche-section {
  background: white;
  border-radius: 12px;
  padding: 1.1rem;
  margin-bottom: 0.65rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
}
.section-label { font-size: 0.63rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.7rem; }
.label-concret { color: #1e45b0; }
.label-formul  { color: #d35400; }
.label-savoir  { color: #27ae60; }
.fiche-section p { font-size: 0.87rem; color: #2d3748; line-height: 1.65; margin-bottom: 0.4rem; }
.fiche-section p:last-child { margin-bottom: 0; }
.fiche-section.formul { background: #fffbf5; border-left: 4px solid #e67e22; }
.fiche-section.savoir { background: #f0fdf4; border-left: 4px solid #27ae60; }
.savoir-item { display: flex; gap: 0.5rem; align-items: flex-start; margin-bottom: 0.45rem; font-size: 0.86rem; color: #2d3748; line-height: 1.55; }
.savoir-item:last-child { margin-bottom: 0; }
.savoir-check { color: #27ae60; flex-shrink: 0; margin-top: 0.05rem; }

/* ── NAV BAS ── */
.bottom-nav {
  background: white;
  border-top: 1px solid #e2e8f0;
  padding: 0.8rem 1rem;
  display: flex; gap: 0.6rem;
  flex-shrink: 0;
}
.bnav-btn { flex: 1; padding: 0.75rem 0.5rem; border-radius: 10px; border: none; cursor: pointer; font-size: 0.82rem; font-weight: 700; transition: transform 0.1s; }
.bnav-btn:active { transform: scale(0.96); }
.bnav-intentions { background: #eff6ff; color: #1e45b0; }
.bnav-situation  { background: #fff8f0; color: #c97010; }
</style>
</head>

let currentSit = null, currentInt = null;

function goTo(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s'+n).classList.add('active');
  window.scrollTo(0,0);
}
function selectSituation(i) { currentSit=i; renderIntentions(); goTo(2); }
function selectIntention(i)  { currentInt=i; renderFiche();      goTo(3); }

function renderSituations() {
  document.getElementById('situations-list').innerHTML = DATA.map((s,i) => `
    <div class="situation-card" onclick="selectSituation(${i})">
      <div class="sit-icon-wrap">${s.icon}</div>
      <div class="sit-content">
        <div class="sit-title">${s.num}. ${s.title}</div>
        <div class="sit-sub">${s.subtitle}</div>
      </div>
      <div class="sit-arrow">›</div>
    </div>`).join('');
}

function renderIntentions() {
  const sit = DATA[currentSit];
  document.getElementById('sit-context-title').textContent = sit.icon+'  '+sit.title;
  document.getElementById('intentions-list').innerHTML = sit.intentions.map((it,i) => `
    <div class="intention-card" onclick="selectIntention(${i})">
      <div class="int-icon-wrap">${it.icon}</div>
      <div class="int-title">${it.title}</div>
      <div class="sit-arrow">›</div>
    </div>`).join('');
}

function renderFiche() {
  const it = DATA[currentSit].intentions[currentInt];
  const c = it.concret.map(p => p?`<p>${p}</p>`:'').join('');
  const f = it.formul.map(p => p===''?'<p>&nbsp;</p>':`<p>${p}</p>`).join('');
  const s = it.savoir.map(p =>`<div class="savoir-item"><span class="savoir-check">✓</span><span>${p}</span></div>`).join('');
  document.getElementById('fiche-scroll').innerHTML = `
    <div class="int-header">
      <div class="int-header-icon">${it.icon}</div>
      <div>
        <div class="int-header-label">Intention</div>
        <div class="int-header-title">${it.title}</div>
      </div>
    </div>
    <div class="fiche-section"><div class="section-label label-concret">Concrètement</div>${c}</div>
    <div class="fiche-section formul"><div class="section-label label-formul">Formulation</div>${f}</div>
    <div class="fiche-section savoir"><div class="section-label label-savoir">À savoir</div>${s}</div>`;
}

renderSituations();
